<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad3)"/>

  <!-- Clean L lettermark -->
  <path d="M144 128 L144 376 L296 376"
        fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Organic leaf/sprout growing from L -->
  <path d="M280 320
           C280 240, 320 180, 380 140
           C400 180, 400 260, 360 320
           C320 360, 280 340, 280 320 Z"
        fill="white" opacity="0.95"/>

  <!-- Leaf stem/vein -->
  <path d="M300 310 Q340 260, 370 180"
        fill="none" stroke="url(#grad3)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Growth sparkle -->
  <circle cx="392" cy="128" r="16" fill="white" opacity="0.7"/>
</svg>
