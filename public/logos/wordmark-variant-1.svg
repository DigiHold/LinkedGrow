<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <defs>
    <linearGradient id="wg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="textGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Icon: Clean L with upward arrow -->
  <rect x="8" y="8" width="64" height="64" rx="14" fill="url(#wg1)"/>

  <!-- L lettermark -->
  <path d="M22 20 L22 52 L40 52"
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rising arrow -->
  <path d="M42 40 L42 24"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <path d="M36 30 L42 24 L48 30"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Momentum dot -->
  <circle cx="56" cy="18" r="4" fill="white" opacity="0.7"/>

  <!-- Text: LinkedGrow (for light backgrounds) -->
  <text x="88" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700">
    <tspan fill="#1e293b">Linked</tspan><tspan fill="url(#textGrad1)">Grow</tspan>
  </text>
</svg>
