<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient: Cyan to Blue -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0891b2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad2)" filter="url(#shadow2)"/>

  <!-- Network connections (LinkedIn = Connections + Growth) -->
  <!-- Connection lines -->
  <g stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="160" y1="192" x2="256" y2="160"/>
    <line x1="256" y1="160" x2="352" y2="192"/>
    <line x1="160" y1="192" x2="160" y2="320"/>
    <line x1="352" y1="192" x2="352" y2="320"/>
    <line x1="160" y1="320" x2="256" y2="352"/>
    <line x1="352" y1="320" x2="256" y2="352"/>
    <line x1="256" y1="160" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="160" y2="320"/>
    <line x1="256" y1="256" x2="352" y2="320"/>
  </g>

  <!-- Central "L" lettermark with growth indicator -->
  <g filter="url(#glow2)">
    <!-- Stylized L -->
    <path d="M200 144 L200 320 L200 368 L312 368"
          fill="none" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Growth arrow emerging from L -->
  <path d="M280 240 L344 176 L344 224 L392 224 L392 176 L344 176"
        fill="white" opacity="0.95"/>
  <polygon points="344,128 408,200 344,200" fill="white"/>

  <!-- Network nodes -->
  <g fill="white" filter="url(#glow2)">
    <circle cx="256" cy="160" r="20"/>
    <circle cx="160" cy="192" r="16"/>
    <circle cx="352" cy="192" r="16"/>
    <circle cx="160" cy="320" r="16"/>
    <circle cx="352" cy="320" r="16"/>
    <circle cx="256" cy="352" r="20"/>
    <circle cx="256" cy="256" r="24" fill="#22d3ee"/>
  </g>
</svg>
