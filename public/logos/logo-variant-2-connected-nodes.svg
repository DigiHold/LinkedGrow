  <line x1="264" y1="240" x2="352" y2="160" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="296" y1="296" x2="384" y2="240" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="296" y1="344" x2="384" y2="320" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Network nodes -->
