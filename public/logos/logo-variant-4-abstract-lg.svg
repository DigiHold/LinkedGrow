<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient: Cyan to Blue -->
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <!-- Secondary gradient for depth -->
    <linearGradient id="grad4b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0891b2" flood-opacity="0.35"/>
    </filter>
    <!-- Inner glow -->
    <filter id="innerGlow4">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad4)" filter="url(#shadow4)"/>

  <!-- Abstract geometric LG mark -->
  <!-- Modern interpretation: L + G combined as ascending geometric shapes -->

  <!-- Base platform (represents LinkedIn foundation) -->
  <rect x="96" y="336" width="320" height="48" rx="24" fill="white" opacity="0.3"/>

  <!-- L shape - bold vertical with horizontal -->
  <path d="M128 128
           L128 336
           L176 336
           L176 176
           L176 176
           L128 128 Z"
        fill="white" opacity="0.95"/>
  <rect x="128" y="288" width="136" height="48" rx="8" fill="white" opacity="0.95"/>

  <!-- G shape - modern geometric interpretation -->
  <!-- Main arc of G -->
  <path d="M280 160
           Q360 160, 384 240
           Q400 320, 320 360
           L280 360
           L280 312
           L320 312
           Q352 296, 352 256
           Q352 208, 304 200
           L280 200
           Z"
        fill="white" opacity="0.95"/>

  <!-- G horizontal bar -->
  <rect x="296" y="248" width="72" height="40" rx="8" fill="white" opacity="0.95"/>

  <!-- Growth sparkles -->
  <g fill="white" filter="url(#innerGlow4)">
    <circle cx="400" cy="136" r="16"/>
    <circle cx="432" cy="168" r="10"/>
    <circle cx="424" cy="120" r="6"/>
  </g>

  <!-- Upward trend line (subtle) -->
  <path d="M160 280 Q220 200, 300 160 Q360 130, 400 136"
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.4"/>
</svg>
