<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient: Cyan to Blue -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <!-- Lighter accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#mainGradient)" filter="url(#shadow)"/>

  <!-- Stylized "L" shape representing LinkedIn + Growth -->
  <!-- Vertical bar of L -->
  <rect x="128" y="128" width="64" height="256" rx="12" fill="white" opacity="0.95"/>

  <!-- Horizontal bar of L with upward growth arrow -->
  <path d="M128 320 L128 384 L320 384 L320 256 L384 320 L320 192 L256 256 L256 320 L192 320 L192 320 Z"
        fill="white" opacity="0.95"/>

  <!-- Growth chart bars (abstract) -->
  <rect x="224" y="304" width="40" height="80" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
  <rect x="280" y="264" width="40" height="120" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
  <rect x="336" y="224" width="40" height="160" rx="8" fill="white" opacity="0.95"/>

  <!-- Upward arrow tip -->
  <path d="M356 128 L356 208 L296 208 L356 128 L416 208 L356 208"
        fill="white" opacity="0.95"
        stroke="white" stroke-width="4" stroke-linejoin="round"/>
</svg>
