services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/iku.db
    volumes:
      - db-data:/var/lib/sqld

  app:
    image: ghcr.io/digihold/linkedgrow:${LINKEDGROW_VERSION:-latest}
    restart: unless-stopped
    # Bound to the loopback address by default, so only the reverse proxy on this
    # machine reaches it. APP_BIND=0.0.0.0 in .env opens the port to the network.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      TURSO_DATABASE_URL: http://db:8080
      TURSO_AUTH_TOKEN: ""
      LINKEDGROW_EDITION: self-hosted
      STORAGE_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  worker:
    image: ghcr.io/digihold/linkedgrow-worker:${LINKEDGROW_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TURSO_DATABASE_URL: http://db:8080
      TURSO_AUTH_TOKEN: ""
      LINKEDGROW_EDITION: self-hosted
      WORKER_ENV: production
      APP_INTERNAL_URL: http://app:3000
      WORKER_SLOTS: ${WORKER_SLOTS:-2}
    shm_size: "2gb"
    volumes:
      - profiles:/data/profiles
      - uploads:/data/uploads
    depends_on:
      app:
        condition: service_healthy

  # Runs only with COMPOSE_PROFILES=https in .env, which the installer sets when
  # you give it a domain. It gets the certificate and renews it on its own.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  profiles:
  caddy-data:
  caddy-config:
