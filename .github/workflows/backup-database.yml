name: Daily Database Backup

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          DB_HOST=$(echo "$TURSO_DATABASE_URL" | sed 's|libsql://||')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%S")
          FILENAME="backup_${TIMESTAMP}.sql"

          echo "Dumping database from ${DB_HOST}..."
          HTTP_CODE=$(curl -s -o "$FILENAME" -w "%{http_code}" \
            "https://${DB_HOST}/dump" \
            -H "Authorization: Bearer ${TURSO_AUTH_TOKEN}")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Dump failed with HTTP ${HTTP_CODE}"
            cat "$FILENAME"
            exit 1
          fi

          SIZE=$(stat --format=%s "$FILENAME" 2>/dev/null || stat -f%z "$FILENAME" 2>/dev/null)
          echo "Backup complete: ${SIZE} bytes -> ${FILENAME}"

          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: Backup too small (${SIZE} bytes), likely auth failure"
            cat "$FILENAME"
            exit 1
          fi

          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
