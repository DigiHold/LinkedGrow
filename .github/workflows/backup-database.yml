name: Daily Database Backup

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Export database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          export PATH="$HOME/.turso:$PATH"
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)

          # Convert libsql:// URL to https:// for the Turso CLI
          HTTP_URL=$(echo "$TURSO_DATABASE_URL" | sed 's|libsql://|https://|')

          turso db shell "$HTTP_URL" --auth-token "$TURSO_AUTH_TOKEN" ".dump" > "backup_${TIMESTAMP}.sql"

          echo "BACKUP_FILE=backup_${TIMESTAMP}.sql" >> $GITHUB_ENV

          FILE_SIZE=$(wc -c < "backup_${TIMESTAMP}.sql")
          echo "Backup size: ${FILE_SIZE} bytes"

          # Fail if backup is empty (likely auth error)
          if [ "$FILE_SIZE" -lt 10 ]; then
            echo "ERROR: Backup file is empty or too small. Check credentials."
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
